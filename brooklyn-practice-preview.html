<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Brooklyn Practice Test</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.head{position:relative;overflow:hidden;background:linear-gradient(110deg,#250001,#69050c 48%,#e00528);color:#fff;height:68px;padding:8px;display:grid;grid-template-columns:92px 1fr 92px;align-items:center}.head:before{content:"KC REBELS";position:absolute;left:-8px;top:-17px;color:rgba(255,255,255,.13);font-size:90px;font-weight:950;letter-spacing:-6px;white-space:nowrap}.head>*{position:relative}.head h1{margin:0;text-align:center;font-size:31px;font-weight:950}.back{border:0;border-radius:10px;background:#fff;padding:11px 10px;font-size:16px;font-weight:900}.main{max-width:520px;margin:auto;padding:14px 13px 28px}.live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.live div{background:#fff;border:2px solid #d4d9d7;border-radius:18px;padding:15px;text-align:center;box-shadow:0 5px 0 #dde1df}.live span,.label{display:block;color:#667085;font-size:13px;font-weight:950;letter-spacing:.08em}.live b{display:block;font-size:37px;margin-top:8px}.card{background:#fff;border:2px solid #d4d9d7;border-radius:18px;padding:17px 18px;margin-bottom:12px;box-shadow:0 5px 0 #dde1df}.label{color:#a62a31}.card h2{font-size:25px;margin:6px 0}.card p{color:#667085;font-size:15px;font-weight:700;line-height:1.4;margin:0}.row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin:10px 0;border:2px solid #d4d9d7;background:#fff;border-radius:16px;padding:0 0 0 14px;box-shadow:0 5px 0 #dde1df}.row:first-of-type{margin-top:10px}.block{font-size:17px;font-weight:950;color:#667085}.drill,.plain{width:100%;border:0;background:transparent;border-radius:0;padding:14px 16px;text-align:left;color:#111827;box-shadow:none}.drill{position:relative;padding-right:44px}.drill:after{content:'›';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:36px;line-height:1;color:#a62a31;font-weight:950}.drill:before{content:'DRILL';display:block;color:#a62a31;font-size:12px;font-weight:950;letter-spacing:.09em;margin-bottom:6px}.drill b{display:block;font-size:18px}.drill small{display:block;color:#667085;font-weight:800;margin-top:5px}.plain b{display:block;font-size:18px}.plain small{display:block;color:#667085;font-weight:750;margin-top:4px}.rotate-overlay{position:fixed;inset:0;z-index:50;background:linear-gradient(145deg,#51070b,#b71825 58%,#e00528);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}.rotate-overlay.show{display:flex}.rotate-inner{width:100%;max-width:460px}.rotate-title{font-size:54px;line-height:1;font-weight:950;letter-spacing:.05em}.rotate-count{font-size:132px;line-height:.95;font-weight:950;margin:22px 0}.rotate-sub{font-size:20px;font-weight:850}.overlay{position:fixed;inset:0;background:#f5f7f6;z-index:20;overflow:auto;display:none}.overlay.open{display:block}.detail{max-width:520px;margin:auto;padding:14px 13px 28px}.hero{background:linear-gradient(115deg,#220809,#651719 52%,#bd2633);color:#fff;border:2px solid #151515;box-shadow:0 6px 0 #6f171b;border-radius:18px;padding:17px 18px;margin-bottom:13px}.hero .label{color:#f1c6cb}.hero h2{font-size:26px;margin:6px 0}.hero p{color:#f6e9ea;font-weight:750}.info{background:#fff;border:2px solid #d4d9d7;border-radius:16px;padding:15px 17px;margin-bottom:10px}.info span{color:#a62a31;font-size:13px;font-weight:950;letter-spacing:.08em}.info p{font-size:16px;font-weight:750;line-height:1.4;margin:6px 0 0}</style></head><body><header class="head"><button class="back" id="portalBack">Back</button><h1>Practice</h1><span></span></header><main class="main"><div class="live"><div><span>BLOCK</span><b id="block">1 of 10</b></div><div><span>TIME LEFT</span><b id="time">11:00</b></div></div><section class="card"><span class="label">ACTIVE HITTING PRACTICE</span><h2>Brooklyn's Practice Plan</h2><p>Test practice · 10 blocks · 11 minutes + 1 minute rotate</p><div id="plan"></div></section></main><div class="rotate-overlay" id="rotateOverlay"><div class="rotate-inner"><div class="rotate-title">ROTATE</div><div class="rotate-count" id="rotateCount">60</div><div class="rotate-sub">Move to your next station</div></div></div><div class="overlay" id="detail"><header class="head"><button class="back" id="detailBack">Back</button><h1>Drill</h1><span></span></header><div class="detail" id="detailBody"></div></div><script>
const drills={outside:{name:'Outside Pitch Recognition',primary:'Outside pitch recognition',secondary:'Pitch selection and controlled aggression',how:'Coach mixes pitches in and away. Attack only pitches you can drive to the opposite field and take pitches that cannot be driven.',cues:'See it deep. Let the ball travel. Stay through the outside half. Do not reach.',success:'Consistently takes poor pitches and drives hittable outside pitches hard to the opposite field.',best:'Hitters who chase away or try to pull outside pitches.'},front:{name:'Opposite-Field Front Toss',primary:'Driving the outside pitch',secondary:'Barrel direction and staying through contact',how:'Front toss is aimed to the outer half. Hitter drives the ball through the opposite-field gap without forcing it.',cues:'Let it travel. Hands inside. Barrel through the ball. Finish through the gap.',success:'Firm line drives through the opposite-field side with consistent barrel contact.',best:'Hitters learning to use the whole field.'},tee:{name:'Deep Tee – Outside Pitch',primary:'Outside-pitch contact point',secondary:'Direction through the ball',how:'Set the tee deeper and on the outer half. Drive the ball through the opposite-field gap.',cues:'Deep contact. Stay connected. Do not hook around the ball.',success:'Repeated hard contact with correct opposite-field direction.',best:'Building the feel for outside-pitch depth.'}};
const schedule=[['Team Warm-Up',null],['Deep Tee – Outside Pitch','tee'],['Opposite-Field Front Toss','front'],['Outside Pitch Recognition','outside'],['Machine Hitting',null],['Live Hitting',null],['Outside Pitch Recognition','outside'],['Opposite-Field Front Toss','front'],['Deep Tee – Outside Pitch','tee'],['Live Hitting',null]];
const plan=document.getElementById('plan');schedule.forEach((x,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML='<div class="block">B'+(i+1)+'</div>'+(x[1]?'<button class="drill" data-drill="'+x[1]+'"><b>'+x[0]+'</b><small>Tap for full drill instructions</small></button>':'<div class="plain"><b>'+x[0]+'</b><small>Practice assignment</small></div>');plan.appendChild(row)});
document.querySelectorAll('[data-drill]').forEach(b=>b.onclick=()=>openDrill(b.dataset.drill));function openDrill(k){const d=drills[k];document.getElementById('detailBody').innerHTML='<section class="hero"><span class="label">DRILL</span><h2>'+d.name+'</h2><p>Full HotB drill instructions</p></section>'+[['PRIMARY FOCUS',d.primary],['SECONDARY FOCUS',d.secondary],['HOW IT WORKS',d.how],['KEY COACHING CUES',d.cues],['WHAT SUCCESS LOOKS LIKE',d.success],['BEST USED FOR',d.best]].map(x=>'<section class="info"><span>'+x[0]+'</span><p>'+x[1]+'</p></section>').join('');document.getElementById('detail').classList.add('open')}
document.getElementById('detailBack').onclick=()=>document.getElementById('detail').classList.remove('open');
const started=Date.now(),testWork=5,rotate=60,normalWork=660;let lastPhase='';function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.volume=1;speechSynthesis.speak(u)}catch(e){}}function tick(){const elapsed=Math.floor((Date.now()-started)/1000);let block,phase,rem;if(elapsed<testWork){block=1;phase='work1';rem=testWork-elapsed}else if(elapsed<testWork+rotate){block=1;phase='rotate';rem=testWork+rotate-elapsed}else{const after=elapsed-testWork-rotate,cycle=normalWork+rotate;block=Math.min(10,2+Math.floor(after/cycle));const within=after%cycle;if(within<normalWork){phase='work'+block;rem=normalWork-within}else{phase='rotate';rem=cycle-within}}document.getElementById('block').textContent=block+' of 10';const ro=document.getElementById('rotateOverlay');if(phase==='rotate'){ro.classList.add('show');document.getElementById('rotateCount').textContent=rem;document.getElementById('time').textContent='ROTATE'}else{ro.classList.remove('show');document.getElementById('time').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0')}if(phase!==lastPhase){if(phase==='rotate')say('Rotate');else if(phase==='work2')say('Block 2. Begin.');else if(/^work/.test(phase)&&phase!=='work1')say('Block '+block+'. Begin.');lastPhase=phase}}tick();setInterval(tick,250);
document.getElementById('portalBack').onpointerdown=e=>{e.preventDefault();const r=new URLSearchParams(location.search).get('return');if(r)location.replace(r);else history.back()}
</script></body></html>
