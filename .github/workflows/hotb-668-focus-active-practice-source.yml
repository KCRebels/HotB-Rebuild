name: HotB 668 Player Portal Focus Active Practice Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotb-668-focus-active-practice-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Focus drills from both published Focus and active practice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app-portal-meg-focus-archive-v1.js')
          s = p.read_text()
          old = "focusDrills=Array.isArray(portalData?.focus?.drills)?portalData.focus.drills:[],focusKey="
          new = "focusDrills=[...(Array.isArray(portalData?.focus?.drills)?portalData.focus.drills:[]),...(Array.isArray(portalData?.activePractice?.focusDrills)?portalData.activePractice.focusDrills:[])],focusKey="
          if old not in s:
              if "portalData?.activePractice?.focusDrills" not in s:
                  raise SystemExit('live player portal Focus source anchor missing')
          else:
              s = s.replace(old, new, 1)
              p.write_text(s)

          idx = Path('index.html')
          t = idx.read_text()
          t2 = re.sub(r'20261027-portal\d+', '20261027-portal668', t)
          if t2 == t and '20261027-portal668' not in t:
              raise SystemExit('portal cache token anchor missing')
          idx.write_text(t2)
          PY
          node --check app-portal-meg-focus-archive-v1.js
          grep -q "activePractice?.focusDrills" app-portal-meg-focus-archive-v1.js
          grep -q "20261027-portal668" index.html
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "KCRebels"
          git config user.email "actions@users.noreply.github.com"
          git add app-portal-meg-focus-archive-v1.js index.html
          git commit -m "Fix live player portal Focus source" || exit 0
          git push
