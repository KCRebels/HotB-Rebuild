name: HotB duration 646
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/hotb_duration_646.py'
      - '.github/workflows/hotb-duration-646.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply duration engine patch
        run: python .github/scripts/hotb_duration_646.py
      - name: Verify JavaScript
        run: |
          node --check practice-scheduler.js
          node --check app-coach-rebels-portals-v10.js
          grep -q 'durationOptions=\[60,72,84,96,108,120,132,144,156,168,180\]' app-coach-rebels-portals-v10.js
          grep -q 'duration%blockMinutes===0' app-coach-rebels-portals-v10.js
          grep -q 'duration%BLOCK_MINUTES===0' practice-scheduler.js
          grep -q '20261027-duration647' index.html
          node -e "const s=require('./practice-scheduler.js'); for(const m of [60,72,84,96,108,120,132,144,156,168,180]){if(s.validDuration(m)!==m)throw new Error('invalid '+m);if(s.blockTimes('17:30',m).length!==m/12)throw new Error('blocks '+m)} if(s.validDuration(135)!==120)throw new Error('135 accepted')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add practice-scheduler.js app-coach-rebels-portals-v10.js index.html
          git diff --cached --check
          git commit -m 'Use 12-minute HotB practice duration intervals'
          git push
