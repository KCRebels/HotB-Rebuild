name: HotB 642 portal refresh credential fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotb-642-portal-refresh-no-pin-block.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow stat refresh without local PIN copies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app-coach-rebels-portals-v10.js')
          s=p.read_text(encoding='utf-8')
          pattern=r"  // Firestore reads one after another, so one slow mobile read could make the\n  // button appear frozen for a very long time\.\n  // MAIN-TEAM PORTAL LOCK: Refresh may publish new player data, but it may\n  // never create or rotate a permanent Rebels portal credential\.\n  const credentialReady=player=>!!player\.portalId&&\(player\.name==='Hailey Marsh'\|\|!!player\.portalPin\);\n  const missingCredential=players\.find\(player=>!credentialReady\(player\)\);\n  if\(missingCredential\)throw new Error\('permanent-player-portal-locked-missing-credential:'\+missingCredential\.name\);\n  for\(const player of players\)\{\n   // Hailey's verified permanent portal is intentionally the legacy no-PIN exception\.\n   // Preserve that credential exactly as-is; never invent or rotate a PIN during refresh\.\n   if\(player\.name==='Hailey Marsh'\)continue;\n   player\.portalPinHash=await portalHash\(player\.portalId,player\.portalPin\);\n  \}\n"
          replacement="  // MAIN-TEAM PORTAL LOCK: stats-only refresh uses the existing permanent portal ID.\n  // A missing local PIN must not block evaluation publishing, and credentials are never rewritten here.\n  const missingPortal=players.find(player=>!player.portalId);\n  if(missingPortal)throw new Error('permanent-player-portal-locked-missing-id:'+missingPortal.name);\n"
          if 'permanent-player-portal-locked-missing-credential:' in s:
              s,n=re.subn(pattern,replacement,s,count=1)
              if n!=1: raise SystemExit('portal credential refresh block not found')
          elif 'permanent-player-portal-locked-missing-id:' not in s:
              raise SystemExit('expected portal refresh marker not found')
          p.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          x=idx.read_text(encoding='utf-8')
          oldv='app-coach-rebels-portals-v10.js?v=20261019-portalsync641'
          newv='app-coach-rebels-portals-v10.js?v=20261019-portalsync642'
          if oldv in x:
              x=x.replace(oldv,newv,1)
          elif newv not in x:
              raise SystemExit('coach cache reference not found')
          idx.write_text(x,encoding='utf-8')
          PY

      - name: Verify
        run: |
          node --check app-coach-rebels-portals-v10.js
          grep -q "permanent-player-portal-locked-missing-id" app-coach-rebels-portals-v10.js
          grep -q "20261019-portalsync642" index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-coach-rebels-portals-v10.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "Allow player stat refresh without local PIN copies"
          git push
