name: HotB 687 Practice Controls

on:
  push:
    paths:
      - '.github/workflows/hotb-687-practice-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/hotb_687_practice_controls.py
      - run: |
          grep -q 'id="savePracticeSetup"' app-coach-rebels-portals-v10.js && exit 1 || true
          grep -q "go('home');window.scrollTo(0,0);" app-coach-rebels-portals-v10.js
          grep -q 'Player and coach practice plans are deactivated.' app-coach-rebels-portals-v10.js
          grep -q '20261028-practice687' index.html
      - run: |
          git config user.name 'HotB Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-coach-rebels-portals-v10.js index.html
          git commit -m 'HotB 687 fix practice controls'
          git push
