name: HotB 661 Focus Drill Match
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hotb-661-focus-drill-match.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make My Practice Focus matching tolerant of drill-name formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-coach-rebels-portals-v10.js')
          s=p.read_text()
          old="function portalPracticeAssignment(entry){const drill=portalAssignmentDrillName(entry.assignment),jenkins=portalData?.portalType==='jenkinsPlayer',practiceOnly=['guestPlayer','guestCoach','jenkinsPlayer'].includes(portalData?.portalType),allowed=!practiceOnly||!!drill&&(portalData?.activePractice?.drills||[]).includes(drill),focusDrills=Array.isArray(portalData?.focus?.drills)?portalData.focus.drills:[],isFocus=!!drill&&focusDrills.includes(drill),badge=isFocus?' <small class=\"portal-practice-focus-badge\" style=\"display:inline-block;margin-left:6px;padding:2px 6px;border:1.5px solid #c71920;border-radius:999px;color:#c71920;background:#fff;font-size:9px;font-weight:950;line-height:1;vertical-align:middle\">FOCUS</small>':'';return !jenkins&&drill&&allowed?`<button class=\"portal-practice-drill-link\" data-portal-practice-drill=\"${esc(drill)}\">${esc(entry.assignment)}${badge}</button>`:`<strong>${esc(entry.assignment)}${badge}</strong>`}"
          new="function portalPracticeAssignment(entry){const drill=portalAssignmentDrillName(entry.assignment),jenkins=portalData?.portalType==='jenkinsPlayer',practiceOnly=['guestPlayer','guestCoach','jenkinsPlayer'].includes(portalData?.portalType),allowed=!practiceOnly||!!drill&&(portalData?.activePractice?.drills||[]).includes(drill),focusDrills=Array.isArray(portalData?.focus?.drills)?portalData.focus.drills:[],focusKey=value=>String(value||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim(),drillKey=focusKey(drill),isFocus=!!drillKey&&focusDrills.some(item=>{const key=focusKey(typeof item==='string'?item:item?.name||item?.drill||'');return !!key&&(key===drillKey||key.includes(drillKey)||drillKey.includes(key))}),badge=isFocus?' <small class=\"portal-practice-focus-badge\" style=\"display:inline-block;margin-left:6px;padding:2px 6px;border:1.5px solid #c71920;border-radius:999px;color:#c71920;background:#fff;font-size:9px;font-weight:950;line-height:1;vertical-align:middle\">FOCUS</small>':'';return !jenkins&&drill&&allowed?`<button class=\"portal-practice-drill-link\" data-portal-practice-drill=\"${esc(drill)}\">${esc(entry.assignment)}${badge}</button>`:`<strong>${esc(entry.assignment)}${badge}</strong>`}"
          if old not in s:
              raise SystemExit('portalPracticeAssignment anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          q=Path('index.html')
          x=q.read_text()
          import re
          x,n=re.subn(r"app-coach-rebels-portals-v10\.js\?v=20261027-portal\d+&fresh=", "app-coach-rebels-portals-v10.js?v=20261027-portal661&fresh=", x, count=1)
          if n!=1: raise SystemExit('portal app cache-bust anchor not found')
          q.write_text(x)
          PY
          node --check app-coach-rebels-portals-v10.js
          grep -q "focusKey=value" app-coach-rebels-portals-v10.js
          grep -q "portal661&fresh=" index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name KCRebels
          git config user.email actions@users.noreply.github.com
          git add app-coach-rebels-portals-v10.js index.html
          git commit -m 'Match player Focus drills by normalized drill name'
          git push
