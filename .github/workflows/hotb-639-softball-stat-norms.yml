name: HotB 639 softball stat norms

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotb-639-softball-stat-norms.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify corrected stat engine
        run: node evaluation-stats.test.js

      - name: Force coach and portal clients onto corrected stat engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='evaluation-stats.js?v=20260923-ipa28'
          new='evaluation-stats.js?v=20261019-statnorm640'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('evaluation-stats cache reference not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit cache-busted stat engine reference
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Deploy corrected HotB softball stats"
          git push
