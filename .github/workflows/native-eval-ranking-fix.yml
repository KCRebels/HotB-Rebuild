name: Native Eval Ranking Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-eval-ranking-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production load tags
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="<script src=\"pwa-update.js?v=20260930-531\"></script>"
          new="<script src=\"pwa-update.js?v=20261010-609\"></script>"
          if old not in s:
              raise SystemExit('pwa-update tag target not found')
          s=s.replace(old,new,1)
          old2="app-coach-rebels-portals-v10.js?v=20261003-practicecleanup1"
          new2="app-coach-rebels-portals-v10.js?v=20261010-evalranking609"
          if old2 not in s:
              raise SystemExit('coach app tag target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Verify production tags
        run: |
          grep -q 'pwa-update.js?v=20261010-609' index.html
          grep -q 'app-coach-rebels-portals-v10.js?v=20261010-evalranking609' index.html
      - name: Commit production wiring
        run: |
          git config user.name "KCRebels"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Force production HotB to load native Evals ranking build 609"
          git pull --rebase origin main
          git push
