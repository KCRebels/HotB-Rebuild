name: HotB production patch runner

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-hotb-637.py'
      - '.github/workflows/hotb-637-scrimmage-report-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch HotB
        run: python3 .github/scripts/patch-hotb-637.py
      - name: Verify production bundle syntax
        run: node --check app-coach-rebels-portals-v10.js
      - name: Commit changes
        run: |
          git config user.name "KCRebels"
          git config user.email "myeldiablo@yahoo.com"
          git add app-coach-rebels-portals-v10.js pwa-update.js service-worker-v620.js
          git diff --cached --check
          git commit -m "Fix Hailey player portal refresh guard" || exit 0
          git pull --rebase origin main
          git push origin main
