name: HotB 643 independent player portal refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotb-643-independent-player-portal-refresh.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make player portal refresh independent per player
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-coach-rebels-portals-v10.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
"""  const missingPortal=players.find(player=>!player.portalId);
  if(missingPortal)throw new Error('permanent-player-portal-locked-missing-id:'+missingPortal.name);
""",
"""  const publishablePlayers=players.filter(player=>!!player.portalId);
  const missingPortalNames=players.filter(player=>!player.portalId).map(player=>player.name);
  if(!publishablePlayers.length)throw new Error('permanent-player-portal-locked-no-ids');
""",
1)

          pattern=re.compile(r"  // Write existing permanent portals in small independent batches\.[\s\S]*?  // The batch commit is the authoritative success point\.")
          replacement="""  // Publish each permanent player independently. One stale/missing portal document
  // must never prevent the rest of the roster from receiving fresh evaluation data.
  const failedPortalRefreshes=[];
  for(let i=0;i<publishablePlayers.length;i++){
   const player=publishablePlayers[i],evaluationData=playerEvaluationPortalPayload(player.name),evaluationVersion=`${Date.now()}-${player.name}`;
   try{
    await timed(portalDoc(player.portalId).update({portalType:'player',playerName:player.name,firstName:practiceFirstName(player.name),evaluationData,evaluationVersion,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),'player-portal-write:'+player.name,20000);
   }catch(error){
    failedPortalRefreshes.push(player.name);
    console.warn('Player portal refresh failed for '+player.name,error);
   }
   portalMessage=`Refreshing player records… ${i+1} of ${publishablePlayers.length}`;render();
  }
  if(failedPortalRefreshes.length===publishablePlayers.length)throw new Error('all-player-portal-writes-failed');
  // The individual update acknowledgement is the authoritative success point."""
          s2,n=pattern.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit('portal batch block not found')
          s=s2

          old="""  portalMessage=`Player records refreshed, including My Evaluation (${activeDateFilterLabel()}). Existing permanent links were kept.`;"""
          new="""  const notUpdated=[...missingPortalNames,...failedPortalRefreshes];
  portalMessage=notUpdated.length?`Player records refreshed for ${publishablePlayers.length-failedPortalRefreshes.length} players. Could not refresh: ${notUpdated.join(', ')}.`:`Player records refreshed, including My Evaluation (${activeDateFilterLabel()}). Existing permanent links were kept.`;"""
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('portal success message anchor not found')

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          x=idx.read_text(encoding='utf-8')
          oldv='app-coach-rebels-portals-v10.js?v=20261019-portalsync642'
          newv='app-coach-rebels-portals-v10.js?v=20261019-portalsync643'
          if oldv in x:
              x=x.replace(oldv,newv,1)
          elif newv not in x:
              raise SystemExit('coach cache reference not found')
          idx.write_text(x,encoding='utf-8')
          PY

      - name: Verify
        run: |
          node --check app-coach-rebels-portals-v10.js
          grep -q "publishablePlayers" app-coach-rebels-portals-v10.js
          grep -q "failedPortalRefreshes" app-coach-rebels-portals-v10.js
          grep -q "20261019-portalsync643" index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-coach-rebels-portals-v10.js index.html
          git diff --cached --check
          git commit -m "Refresh each player portal independently"
          git push
