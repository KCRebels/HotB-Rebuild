name: HotB 634 live pitcher context
on:
  push:
    paths:
      - '.github/scripts/patch-hotb-634.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch HotB
        run: python3 .github/scripts/patch-hotb-634.py
      - name: Verify production bundle syntax
        run: node --check app-coach-rebels-portals-v10.js
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app-coach-rebels-portals-v10.js index.html pwa-update.js service-worker-v618.js
          git commit -m "Scope FPS chart and NXT to current pitcher" || exit 0
          git pull --rebase origin main
          git push origin main
