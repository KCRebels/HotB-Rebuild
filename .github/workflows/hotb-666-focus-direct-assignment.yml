name: HotB 667 Live Player Portal Focus Match

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotb-666-focus-direct-assignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Focus matching in the bundle permanent player links actually load
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-portal-meg-focus-archive-v1.js')
          s=p.read_text()
          old="focusDrills=Array.isArray(portalData?.focus?.drills)?portalData.focus.drills:[],isFocus=!!drill&&focusDrills.includes(drill),badge=isFocus?"
          new="focusDrills=Array.isArray(portalData?.focus?.drills)?portalData.focus.drills:[],focusKey=value=>String(value||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim(),drillKey=focusKey(drill),assignmentKey=focusKey(entry.assignment),isFocus=focusDrills.some(item=>{const key=focusKey(typeof item==='string'?item:item?.name||item?.drill||'');return !!key&&((!!drillKey&&(key===drillKey||key.includes(drillKey)||drillKey.includes(key)))||assignmentKey===key||assignmentKey.includes(key))}),badge=isFocus?"
          if old not in s:
              raise SystemExit('live player portal Focus matcher anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          t2=re.sub(r'20261027-portal\d+', '20261027-portal667', t)
          if t2==t:
              raise SystemExit('portal cache token anchor missing')
          idx.write_text(t2)
          PY
          node --check app-portal-meg-focus-archive-v1.js
          grep -q "assignmentKey.includes(key)" app-portal-meg-focus-archive-v1.js
          grep -q "20261027-portal667" index.html
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "KCRebels"
          git config user.email "actions@users.noreply.github.com"
          git add app-portal-meg-focus-archive-v1.js index.html
          git commit -m "Fix Focus badges in live player portal" || exit 0
          git push
