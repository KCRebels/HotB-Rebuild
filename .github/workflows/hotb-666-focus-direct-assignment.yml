name: HotB 666 Direct Player Practice Focus Match

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotb-666-focus-direct-assignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Focus directly against the rendered player assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-coach-rebels-portals-v10.js')
          s=p.read_text()
          old="focusKey=value=>String(value||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim(),drillKey=focusKey(drill),isFocus=!!drillKey&&focusDrills.some(item=>{const key=focusKey(typeof item==='string'?item:item?.name||item?.drill||'');return !!key&&(key===drillKey||key.includes(drillKey)||drillKey.includes(key))})"
          new="focusKey=value=>String(value||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim(),drillKey=focusKey(drill),assignmentKey=focusKey(entry.assignment),isFocus=focusDrills.some(item=>{const key=focusKey(typeof item==='string'?item:item?.name||item?.drill||'');return !!key&&((!!drillKey&&(key===drillKey||key.includes(drillKey)||drillKey.includes(key)))||assignmentKey===key||assignmentKey.includes(key))})"
          if old not in s:
              raise SystemExit('portal Focus matcher anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          t2=re.sub(r'20261027-portal\d+', '20261027-portal666', t)
          if t2==t:
              raise SystemExit('portal cache token anchor missing')
          idx.write_text(t2)
          PY
          node --check app-coach-rebels-portals-v10.js
          grep -q "assignmentKey.includes(key)" app-coach-rebels-portals-v10.js
          grep -q "20261027-portal666" index.html
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "KCRebels"
          git config user.email "actions@users.noreply.github.com"
          git add app-coach-rebels-portals-v10.js index.html
          git commit -m "Match player Focus directly from practice assignment text" || exit 0
          git push
