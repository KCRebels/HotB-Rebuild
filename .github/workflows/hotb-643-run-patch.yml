name: HotB 643 run portal patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotb-643-run-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/hotb_643_portal_refresh.py
      - run: node --check app-coach-rebels-portals-v10.js
      - run: grep -q "20261019-portalsync643" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-coach-rebels-portals-v10.js index.html
          git diff --cached --check
          git commit -m "Refresh each player portal independently"
          git push
