name: Practice Resolution Verification
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'practice-resolution.test.js'
      - 'practice-resolution-runtime.test.js'
      - 'practice-scheduler.js'
      - 'practice-scheduler.test.js'
      - 'practice-session.js'
      - 'index.html'
      - 'service-worker.js'
      - 'pwa-update.js'
      - 'pwa-update.test.js'
      - 'manifest.webmanifest'
      - 'hotb-fresh.html'
      - '.github/workflows/practice-resolution.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check practice-scheduler.js
          node --check practice-session.js
          node --check service-worker.js
      - name: Run Practice Resolution contracts
        run: node practice-resolution.test.js
      - name: Run Practice Resolution runtime regression
        run: node practice-resolution-runtime.test.js
      - name: Run full practice scheduler regression
        run: node practice-scheduler.test.js
      - name: Run installed-app update regression
        run: node pwa-update.test.js
      - name: Verify deployed bundle markers
        run: |
          test "$(grep -o "app.js?v=20260921-resolution423" index.html | wc -l)" -eq 2
          ! grep -q "app.js?v=20260921-resolution416" index.html
          grep -q "app.js?v=20260921-resolution423" index.html
          test "$(grep -o "practice-scheduler.js?v=20260921-resolution423" index.html | wc -l)" -eq 1
          ! grep -q "practice-scheduler.js?v=20260921-resolution416" index.html
          grep -q "BUILD_VERSION = '2026.09.21.226'" service-worker.js
          grep -q "'./practice-scheduler.js'" service-worker.js
          grep -Fq "/\\/practice-scheduler\\.js" service-worker.js
          grep -Fq "'./manifest.webmanifest'" service-worker.js
          grep -Fq "'./pwa-update.js'" service-worker.js
          grep -Fq "/\\/pwa-update\\.js" service-worker.js
          grep -Fq "/\\/manifest\\.webmanifest" service-worker.js
          grep -q "launch=226" service-worker.js
          grep -q "pwa-update.js?v=20260921-pwa226" index.html
          grep -q "BUILD_VERSION = '2026.09.21.226'" pwa-update.js
          grep -q "url.searchParams.set('launch','226')" pwa-update.js
          ! grep -q "20260920-pwa221" index.html
          ! grep -q "2026.09.20.221" pwa-update.js
          grep -q "launch=226" hotb-fresh.html
          ! grep -q "launch=136" hotb-fresh.html
          grep -q '"start_url": "./?source=pwa&launch=226"' manifest.webmanifest
          ! grep -q 'launch=221' manifest.webmanifest
          grep -q "manifest.webmanifest?v=20260921-launch226" index.html
          ! grep -q "manifest.webmanifest?v=20260919-launch138" index.html
          ! grep -q "Finalizing Resolution" app.js
