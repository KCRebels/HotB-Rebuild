name: Practice Resolution Verification
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'practice-resolution.test.js'
      - 'practice-scheduler.js'
      - 'practice-scheduler.test.js'
      - 'practice-session.js'
      - 'practice-session.test.js'
      - 'app-persistence.test.js'
      - '.github/workflows/practice-resolution.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check practice-scheduler.js
          node --check practice-session.js
      - name: Run Practice Resolution contracts
        run: node practice-resolution.test.js
      - name: Run practice scheduler tests
        run: node practice-scheduler.test.js
      - name: Run practice session tests
        if: always()
        run: node practice-session.test.js
      - name: Run app persistence tests
        if: always()
        run: node app-persistence.test.js
