name: Practice Resolution Verification
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'app-navtest-live-v20.js'
      - 'styles.css'
      - 'team-jenkins-practice-only.test.js'
      - 'practice-resolution.test.js'
      - 'practice-resolution-runtime.test.js'
      - 'practice-scheduler.js'
      - 'practice-scheduler.test.js'
      - 'practice-session.js'
      - 'index.html'
      - 'firestore.rules'
      - 'recruiting-workflow.js'
      - 'player-recruiting-profile.html'
      - 'scouting-report.test.js'
      - 'service-worker.js'
      - 'pwa-update.js'
      - 'pwa-update.test.js'
      - 'manifest.webmanifest'
      - 'hotb-fresh.html'
      - '.github/workflows/practice-resolution.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check app-navtest-live-v20.js
          node --check practice-scheduler.js
          node --check practice-session.js
          node --check service-worker.js
          node --check pwa-update.js
          node --check recruiting-workflow.js
      - name: Run scouting report regression
        run: node scouting-report.test.js
      - name: Run Team Jenkins practice-only contracts
        run: node team-jenkins-practice-only.test.js
      - name: Run Practice Resolution contracts
        run: node practice-resolution.test.js
      - name: Run Practice Resolution runtime regression
        run: node practice-resolution-runtime.test.js
      - name: Run full practice scheduler regression
        run: node practice-scheduler.test.js
      - name: Run installed-app update regression
        run: node pwa-update.test.js
      - name: Verify deployed bundle markers
        run: |
          test "$(grep -o "app-navtest-live-v20.js?v=20260927-opponentpitcher3" index.html | wc -l)" -eq 1
          grep -q "styles.css?v=20260926-navicons21" index.html
          test "$(grep -o "practice-scheduler.js?v=20260922-resolution503" index.html | wc -l)" -eq 1
          grep -q "pwa-update-test-disabled.js?v=20260926-jenkinsrank3" index.html
          grep -q '"start_url": "./?source=pwa&launch=300"' manifest.webmanifest
          grep -q "manifest.webmanifest?v=20260925-hotbicon2" index.html
          grep -q "HotB Build 317" index.html
          ! grep -q "Drill recommendations will appear here" app-navtest-live-v20.js
          ! grep -q "Finalizing Resolution" app.js
