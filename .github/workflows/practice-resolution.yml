name: Practice Resolution Verification
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'practice-resolution.test.js'
      - 'practice-resolution-runtime.test.js'
      - 'practice-scheduler.js'
      - 'practice-session.js'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/practice-resolution.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check practice-scheduler.js
          node --check practice-session.js
          node --check service-worker.js
      - name: Run Practice Resolution contracts
        run: node practice-resolution.test.js
      - name: Run Practice Resolution runtime regression
        run: node practice-resolution-runtime.test.js
      - name: Verify deployed bundle markers
        run: |
          grep -q "app.js?v=20260921-resolution392" index.html
          grep -q "BUILD_VERSION = '2026.09.21.223'" service-worker.js
          grep -q "launch=223" service-worker.js
          ! grep -q "Finalizing Resolution" app.js
