name: HotB 641 player portal cache bust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotb-641-player-portal-cache-bust.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force clients onto player portal sync build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='app-coach-rebels-portals-v10.js?v=20261018-pitcherreset634'
          new='app-coach-rebels-portals-v10.js?v=20261019-portalsync641'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('coach bundle cache reference not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Deploy player portal auto-sync build"
          git push
