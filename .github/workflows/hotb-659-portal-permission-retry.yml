name: HotB 659 Portal Permission Retry
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotb-659-portal-permission-retry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal permission retry
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('app-coach-rebels-portals-v10.js')
          s = p.read_text()
          old = "if((String(error?.message||'')==='portal-read-timeout'||code==='unavailable')&&schedulePortalRetry())return;"
          new = "if(code==='permission-denied'&&!guestPortalSecret&&!isCoachPortalUser()){try{await portalAuthUser?.getIdToken?.(true)}catch(_){}if(schedulePortalRetry())return;}\n  if((String(error?.message||'')==='portal-read-timeout'||code==='unavailable')&&schedulePortalRetry())return;"
          if new not in s:
              if old not in s:
                  raise SystemExit('retry anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          q = Path('index.html')
          x = q.read_text()
          x = x.replace("s.src='app-coach-rebels-portals-v10.js?v=20261027-focus657&fresh='+Date.now();", "s.src='app-coach-rebels-portals-v10.js?v=20261027-portal659&fresh='+Date.now();", 1)
          if 'portal659&fresh=' not in x:
              raise SystemExit('index anchor not found')
          q.write_text(x)
          PY
          node --check app-coach-rebels-portals-v10.js
          grep -q portal659 index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name KCRebels
          git config user.email actions@users.noreply.github.com
          git add app-coach-rebels-portals-v10.js index.html
          git commit -m 'Retry permission denied before player PIN screen'
          git push
