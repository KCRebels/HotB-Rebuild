<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>HotB Repair 332</title></head>

<script>
(async()=>{try{
 if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}
 if(window.caches){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)))}
}catch(_){}
const u=new URL('./',location.href);u.searchParams.set('repair','332');u.searchParams.set('bundle','v30');u.searchParams.set('reload',Date.now().toString());location.replace(u.href);
})();
</script></body></html>
